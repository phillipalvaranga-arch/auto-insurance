name: Daily website and source check
on:
  schedule:
    - cron: '15 12 * * *'   # 6:15 am Central (standard time)
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: status, cancel-in-progress: false}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/check_status.py
      - run: |
          git config user.name "auto-insurance-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/status.json
          git diff --cached --quiet || (git commit -m "Daily status check" && git pull --rebase && git push)
